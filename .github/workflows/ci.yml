# Offline-safe checks on every pull request and every push to main. No Cloudflare secrets:
# nothing here deploys or calls a cloud. Actions are pinned to full commit SHAs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0 # engines pin (packages/framework/package.json)
          cache: npm

      - run: npm ci

      - name: Playwright browser (used by the template and skill browser tests)
        run: npx playwright install --with-deps chromium

      - name: Verify (build, typecheck, lint, unit tests, template and reference app verify)
        run: npm run verify

      - name: Skill tests, including the Claude Code plugin manifests
        run: npx vitest run --config vitest.integration.config.ts tests/skill

      - name: npm create, offline, against the packed framework
        run: npx vitest run --config vitest.integration.config.ts packages/create-prototype-app

      - name: Package contents
        run: npm pack --dry-run --workspace packages/framework --workspace packages/create-prototype-app
