openapi: 3.1.0
info:
  title: Password login provider and mail capture routes (framework-internal)
  version: 0.1.0
  description: |
    Internal HTTP contract: the routes of the email-and-password login provider and the
    test-stage mail capture. Kept apart from framework.openapi.yaml because these routes carry
    email addresses; they are framework-owned, not app-facing (E2E-016 does not scan this file).
    Owners: PWD (all /api/auth routes here), MAIL (/api/__framework/test-mail).
    Behavior: docs/components/password.md, docs/components/mail.md, docs/components/auth.md.

    Rules for every POST here (PWD §2, DEC-0516):
    - `Origin` must equal the deployment's public origin, with or without a session; otherwise
      403 AUTH.REQUEST_FORGERY (AUTH-REQ-007).
    - Bodies are `application/x-www-form-urlencoded` (the pages' forms) or `application/json`.
    - With `Accept: application/json` the answer is JSON as below; otherwise it is a 303 to a
      page (`Location` below), with errors shown on that page as a generic message.
    - Every endpoint can answer 429 AUTH.RATE_LIMITED (PWD-REQ-006, PAR-242, PAR-243, PAR-258,
      PAR-259) with a `Retry-After` header.
    - Answers never contain the address, the password, a token or a provider body, and are the
      same for an existing and an unknown address wherever PWD-REQ-005 says so.
    - Responses are never cached (`Cache-Control: no-store`).

    The two codes AUTH.NOT_VERIFIED (403) and AUTH.RATE_LIMITED (429, retryable) join
    contracts/ts/errors.d.ts with the error catalogue (DEC-0520).

    Routes marked `x-test-stage-only: true` exist only locally and in test stages; in
    production deployments they respond 404 HTTP.NOT_FOUND.
paths:
  /api/auth/sign-in:
    get:
      summary: Sign-in page
      description: Server-rendered HTML form posting to /api/auth/password/sign-in, with links to sign-up, forgot and resend. Shows a generic message for `?error=`.
      parameters:
        - { name: returnTo, in: query, schema: { type: string }, description: Same-origin path to return to after sign-in; anything else is replaced by "/". }
        - { name: error, in: query, schema: { enum: [login_failed, not_verified, rate_limited, forgery] } }
        - { name: notice, in: query, schema: { enum: [check_email, verified, password_reset] } }
      responses:
        "200": { $ref: "#/components/responses/Page" }
  /api/auth/sign-up:
    get:
      summary: Sign-up page
      description: Form for email address, password and display name, posting to /api/auth/password/sign-up.
      responses:
        "200": { $ref: "#/components/responses/Page" }
  /api/auth/forgot:
    get:
      summary: Forgotten-password page
      description: Form for an email address, posting to /api/auth/password/forgot. Also offers resend (/api/auth/password/resend).
      responses:
        "200": { $ref: "#/components/responses/Page" }
  /api/auth/verify:
    get:
      summary: Verification page (the link in the verification email)
      description: Shows one button that posts the token to /api/auth/password/verify. Changes nothing itself, so mail scanners cannot use the link.
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Page" }
  /api/auth/reset:
    get:
      summary: Reset page (the link in the reset email)
      description: Form for the new password, posting the token to /api/auth/password/reset. Changes nothing itself.
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Page" }
  /api/auth/password/sign-up:
    post:
      summary: Create an account and mail a verification link
      description: Same answer for a new and an existing address; an existing address is mailed a notice instead (PWD-REQ-005). Creates no session. The form answer is a 303 to /api/auth/sign-in?notice=check_email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                password: { type: string, description: "PAR-254 to PAR-255 characters." }
                displayName: { type: string, minLength: 1 }
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/SignUpForm" }
      responses:
        "200": { $ref: "#/components/responses/CheckEmail" }
        "303": { $ref: "#/components/responses/SeeOther" }
        default: { $ref: "#/components/responses/Error" }
  /api/auth/password/sign-in:
    post:
      summary: Sign in and create the framework session
      description: |
        On success sets the framework session cookie (AUTH-REQ-006) and no other cookie. Errors:
        400 AUTH.LOGIN_FAILED (unknown address or wrong password, one answer), 403
        AUTH.NOT_VERIFIED, 429 AUTH.RATE_LIMITED. A refused sign-in sends no email. Form answer:
        303 to `returnTo`, or to /api/auth/sign-in?error=… on failure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string }
                password: { type: string }
                returnTo: { type: string }
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/SignInForm" }
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie: { schema: { type: string }, description: The framework session cookie only. }
          content:
            application/json:
              schema:
                type: object
                required: [result, returnTo]
                additionalProperties: false
                properties:
                  result: { const: signed-in }
                  returnTo: { type: string, description: The sanitized same-origin path. }
        "303": { $ref: "#/components/responses/SeeOther" }
        default: { $ref: "#/components/responses/Error" }
  /api/auth/password/resend:
    post:
      summary: Mail a new verification link
      description: Always the same answer; mails only if the address has an unverified account. The form answer is a 303 to /api/auth/sign-in?notice=check_email.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailOnly" }
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/EmailOnly" }
      responses:
        "200": { $ref: "#/components/responses/CheckEmail" }
        "303": { $ref: "#/components/responses/SeeOther" }
        default: { $ref: "#/components/responses/Error" }
  /api/auth/password/verify:
    post:
      summary: Verify an address with the mailed token
      description: Creates no session and sets no cookie. Error 400 AUTH.LOGIN_FAILED for an invalid or expired token (PAR-256). The form answer is a 303 to /api/auth/sign-in?notice=verified.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenOnly" }
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/TokenOnly" }
      responses:
        "200":
          description: Verified.
          content:
            application/json:
              schema: { type: object, required: [result], additionalProperties: false, properties: { result: { const: verified } } }
        "303": { $ref: "#/components/responses/SeeOther" }
        default: { $ref: "#/components/responses/Error" }
  /api/auth/password/forgot:
    post:
      summary: Mail a password reset link
      description: Always the same answer; mails only if the address has an account. The form answer is a 303 to /api/auth/sign-in?notice=check_email.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailOnly" }
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/EmailOnly" }
      responses:
        "200": { $ref: "#/components/responses/CheckEmail" }
        "303": { $ref: "#/components/responses/SeeOther" }
        default: { $ref: "#/components/responses/Error" }
  /api/auth/password/reset:
    post:
      summary: Set a new password with the mailed token
      description: The token is single-use and valid for PAR-257. Errors are 400 AUTH.LOGIN_FAILED (invalid, used or expired token) and 400 HTTP.INVALID_INPUT (password length). Creates no session. The form answer is a 303 to /api/auth/sign-in?notice=password_reset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              additionalProperties: false
              properties:
                token: { type: string }
                password: { type: string, description: "PAR-254 to PAR-255 characters." }
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema: { type: object, required: [result], additionalProperties: false, properties: { result: { const: password-reset } } }
        "303": { $ref: "#/components/responses/SeeOther" }
        default: { $ref: "#/components/responses/Error" }
  /api/__framework/test-mail:
    get:
      summary: Latest captured framework email to an address (test stages)
      x-test-stage-only: true
      description: Reads the test-stage capture sender's store (MAIL §2). Anonymous; GET only. 404 HTTP.NOT_FOUND when nothing was sent to the address.
      parameters:
        - { name: to, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailMessage" }
        default: { $ref: "#/components/responses/Error" }
components:
  schemas:
    SignUpForm:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string }
        password: { type: string }
        displayName: { type: string }
    SignInForm:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
        returnTo: { type: string }
    EmailOnly:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string }
    TokenOnly:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string }
    MailMessage:
      type: object
      required: [to, from, subject, text, html, sentAt]
      additionalProperties: false
      properties:
        to: { type: string }
        from: { type: string, description: '"<senderName> <no-reply@<emailDomain>>" (MAIL-REQ-003).' }
        subject: { type: string }
        text: { type: string }
        html: { type: string }
        sentAt: { type: string, format: date-time }
  responses:
    Page:
      description: Server-rendered HTML page with plain forms and no script. Never echoes an address.
      headers:
        Cache-Control: { schema: { const: no-store } }
      content:
        text/html: { schema: { type: string } }
    CheckEmail:
      description: Accepted; the same answer whether or not an account exists.
      content:
        application/json:
          schema: { type: object, required: [result], additionalProperties: false, properties: { result: { const: check-email } } }
    SeeOther:
      description: Form answer. Redirect to a page on the same origin.
      headers:
        Location: { schema: { type: string } }
    Error:
      description: A framework ErrorResponse (framework.openapi.yaml). The status comes from the error catalogue.
      content:
        application/json:
          schema: { $ref: "../framework.openapi.yaml#/components/schemas/ErrorResponse" }
