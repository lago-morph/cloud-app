<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KubeCon planner</title>
    <style>
      :root {
        --bg: #f6f7f9; --panel: #ffffff; --text: #1d2230; --muted: #5b6475; --line: #dde1e8;
        --accent: #2563eb; --accent-soft: #e6eefc; --conflict: #c2410c; --conflict-soft: #fdeee6;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); background: var(--bg);
      }
      body { margin: 0; }
      #app { max-width: 1100px; margin: 0 auto; padding: 16px; }
      header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
      header h1 { margin: 0; font-size: 1.5rem; }
      header > p { margin: 0; color: var(--muted); flex: 1; }
      .account { display: flex; gap: 8px; align-items: center; color: var(--muted); }
      .account p { margin: 0; }
      button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 4px 10px; }
      button:disabled { opacity: 0.6; cursor: progress; }
      nav { display: flex; gap: 4px; margin: 16px 0; border-bottom: 1px solid var(--line); }
      nav button { border: none; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 8px 12px; font-weight: 600; color: var(--muted); }
      nav button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
      .source { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .status, .count, .summary { color: var(--muted); margin: 8px 0; }
      .error { color: var(--conflict); margin: 4px 0; }
      .error:empty { display: none; }
      .filters { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 8px; margin: 8px 0; }
      .filters label { display: flex; flex-direction: column; font-size: 0.8rem; color: var(--muted); gap: 2px; }
      .filters input, .filters select { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
      @media (max-width: 700px) { .filters { grid-template-columns: 1fr 1fr; } }
      .day h3 { position: sticky; top: 0; background: var(--bg); margin: 16px 0 4px; padding: 4px 0; }
      .session { display: grid; grid-template-columns: 11rem 1fr auto; gap: 8px 12px; align-items: start; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin: 4px 0; }
      .session.selected { border-color: var(--accent); background: var(--accent-soft); }
      .session .when { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.9rem; }
      .session .meta, .session .speakers { color: var(--muted); font-size: 0.85rem; }
      button.link { border: none; background: none; padding: 0; text-align: left; color: var(--text); font-weight: 600; }
      button.link:hover { color: var(--accent); text-decoration: underline; }
      .toggle { white-space: nowrap; }
      .toggle.on { background: var(--accent); border-color: var(--accent); color: #fff; }
      dialog.details { max-width: 680px; width: calc(100% - 32px); border: none; border-radius: 10px; padding: 20px 24px; }
      dialog.details::backdrop { background: rgb(0 0 0 / 35%); }
      dialog.details .close { float: right; }
      dialog.details dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
      dialog.details dt { color: var(--muted); }
      dialog.details dd { margin: 0; }
      .description { white-space: pre-line; }
      .day-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
      .day-tabs .tab { display: flex; flex-direction: column; align-items: center; min-width: 5.5rem; padding: 6px 10px; }
      .day-tabs .tab span { font-weight: 700; }
      .day-tabs .tab small { color: var(--muted); }
      .day-tabs .tab .n.warn { color: var(--conflict); font-weight: 600; }
      .day-tabs .tab.active { border-color: var(--accent); background: var(--accent-soft); }
      .grid { display: grid; grid-template-columns: 4.5rem 1fr; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 8px 12px 0; }
      .hours { position: relative; }
      .hours span { position: absolute; right: 8px; transform: translateY(-50%); font-size: 0.75rem; color: var(--muted); }
      .lanes { position: relative; border-left: 1px solid var(--line); }
      .hour-line { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); }
      .block { position: absolute; overflow: hidden; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left; padding: 3px 6px; border: 1px solid var(--accent); border-left-width: 4px; background: var(--accent-soft); border-radius: 6px; font-size: 0.8rem; line-height: 1.2; }
      .block .head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .block .time { color: var(--muted); font-variant-numeric: tabular-nums; }
      .block .name { font-weight: 600; }
      .block .room { color: var(--muted); font-size: 0.75rem; }
      .block.conflict { border-color: var(--conflict); background: var(--conflict-soft); }
      .block .badge { background: var(--conflict); color: #fff; border-radius: 4px; padding: 0 5px; font-size: 0.7rem; font-weight: 700; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
